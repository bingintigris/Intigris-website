<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homepage Salesforce: varianten | Intigris</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="design-system/site.css?v=1789080000002">
  <link rel="icon" href="assets/logo-coral.png">
  <script>
    window.__lang = new URLSearchParams(window.location.search).get('lang') === 'en' ? 'en' : 'nl';
    window.tx = function (en, nl) { return window.__lang === 'nl' ? nl : en; };
  </script>
</head>
<body style="background: var(--intigris-brown-700); margin: 0;">
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="text/babel" src="components/CloudKit.jsx?v=1789080000002"></script>
  <script type="text/babel" src="components/HomePlatform.jsx?v=1789080000002"></script>
  <script type="text/babel">
    if (window.gsap) window.gsap.registerPlugin(window.ScrollTrigger);
    /* Homepage (Salesforce view) design rounds. ?section=3 · ?only=a|b|c · ?p=0..1 (test: jump the scroll animation) */
    const Q = new URLSearchParams(window.location.search);
    const ONLY = Q.get('only');
    const Label = ({ n, text, light }) => (
      <div style={{ display: 'inline-flex', alignItems: 'center', gap: 12, fontSize: 15, marginBottom: 22, color: light ? 'var(--intigris-off-white)' : 'var(--intigris-brown-700)' }}>
        <span style={{ width: 34, height: 34, borderRadius: '50%', background: light ? 'var(--intigris-coral)' : 'var(--intigris-brown-700)', color: light ? 'var(--intigris-brown-700)' : 'var(--intigris-off-white)', display: 'grid', placeItems: 'center', fontWeight: 700 }}>{n}</span> {text}
      </div>
    );
    function App() {
      const head = { eyebrow: tx('THE PLATFORM', 'HET PLATFORM'), a: tx('Everything Salesforce,', 'Alles van Salesforce,'), b: tx('built up layer by layer.', 'laag voor laag opgebouwd.') };
      const show = k => !ONLY || ONLY === k;
      return (
        <main>
          {!ONLY && (
            <header className="container-wide" style={{ paddingBlock: '72px 40px', color: 'var(--intigris-off-white)' }}>
              <div className="eyebrow">{tx('HOMEPAGE · SALESFORCE · SECTION 3', 'HOMEPAGE · SALESFORCE · SECTIE 3')}</div>
              <h1 style={{ color: 'var(--intigris-off-white)', fontSize: 'clamp(40px, 6vw, 80px)', fontWeight: 500, letterSpacing: '-.035em', lineHeight: 1, margin: '18px 0 14px' }}>{tx('The platform.', 'Het platform.')} <span style={{ color: 'var(--intigris-coral)', fontStyle: 'italic' }}>{tx('Pick one.', 'Kies er één.')}</span></h1>
              <p style={{ fontSize: 18, color: 'rgba(252,247,235,.8)', maxWidth: 720, margin: 0 }}>{tx('Five layers, from your own systems up to Slack. Scroll slowly through each version.', 'Vijf lagen, van je eigen systemen tot en met Slack. Scroll rustig door elke versie.')}</p>
            </header>
          )}
          {show('a') && <HomePlatformStack head={head} label={<Label n="A" text={tx('Stack: layers drop in and stack up', 'Stapel: de lagen vallen op hun plek en stapelen op')} />} />}
          {show('b') && <HomePlatformRings head={head} label={<Label n="B" light text={tx('Rings: Data 360 at the core, rings light up outwards', 'Ringen: Data 360 in de kern, ringen lichten naar buiten op')} />} />}
          {show('c') && <HomePlatformRide head={head} label={<Label n="C" text={tx('Ride: a horizontal journey through the layers', 'Rit: een horizontale reis door de lagen')} />} />}
          <div style={{ height: '60vh', background: 'var(--intigris-brown-700)' }} />
          <CkStyles /><HpStyles />
        </main>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    const P = Q.get('p');
    if (P !== null) setTimeout(() => { const st = window.ScrollTrigger && ScrollTrigger.getAll()[0]; if (!st) return; const tl = st.animation; st.kill(true); tl.progress(parseFloat(P)).pause(); }, 2500);
  </script>
</body>
</html>
