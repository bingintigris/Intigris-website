      { en: 'Month 2', nl: 'Maand 2',

      { en: 'Month 3', nl: 'Maand 3',

    function ISA({ onJoin }) {
      return (

                  )}
                </p>
              </div>

            .isa-linkcard:hover .isa-more span { transform: translateX(3px); display:inline-block; }
            @media (max-width: 960px) {
              .isa-hero-grid { grid-template-columns: 1fr !important; }

    function App() {
      const [lang, setLang] = useState('en');
      const [contact, setContact] = useState(null); // null (closed) | { subject, message }
      function changeLang(l){ window.__lang = l; setLang(l); }
      function nav(r){
        if (r === 'contact') return setContact({ subject: '', message: '' });
        if (r === 'blog') return (window.location.href = 'Blog.html');
        return (window.location.href = 'index.html');
      }
      const openJoin = () => setContact({ subject: tx(ISA_SUBJECT.en, ISA_SUBJECT.nl), message: tx(ISA_MESSAGE.en, ISA_MESSAGE.nl) });
      return (
        <>
          <SiteHeader overlay={false} megaTheme="cream" lang={lang} onLang={changeLang} onNav={nav} />
          <ISA key={'isa-' + lang} onJoin={openJoin} />
          <SiteNewsletter key={'nl-' + lang} />
          <SiteFooter />
          <SiteCookieConsent />
          <SiteContactSheet open={contact !== null} onClose={() => setContact(null)} subject={contact?.subject} message={contact?.message} source="ISA.html" />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
