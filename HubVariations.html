<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Integratie-animatie: 3 varianten | Intigris</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="design-system/site.css?v=1788910000000">
  <link rel="icon" href="assets/logo-coral.png">
  <script>
    window.__lang = new URLSearchParams(window.location.search).get('lang') === 'en' ? 'en' : 'nl';
    window.tx = function (en, nl) { return window.__lang === 'nl' ? nl : en; };
  </script>
</head>
<body style="background: var(--intigris-brown-700); margin: 0;">
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="text/babel" src="components/CloudKit.jsx?v=1788910000000"></script>
  <script type="text/babel" src="components/CloudKitV3.jsx?v=1788910000000"></script>
  <script type="text/babel" src="components/FieldServiceV2.jsx?v=1788910000000"></script>
  <script type="text/babel" src="components/CloudPagesV3.jsx?v=1788910000000"></script>
  <script type="text/babel" src="components/HubVariants.jsx?v=1788910000000"></script>
  <script type="text/babel">
    if (window.gsap && window.ScrollTrigger) window.gsap.registerPlugin(window.ScrollTrigger);
    const ONLY = new URLSearchParams(window.location.search).get('only'); /* ?only=a|b|c shows one variation */
    function App() {
      const items = sc3.integrations();
      if (ONLY) return (
        <main>
          {ONLY === 'a' && <HubLanding items={items} />}
          {ONLY === 'b' && <HubOrbit items={items} />}
          {ONLY === 'c' && <HubPlugIn items={items} />}
          <CkStyles /><HvStyles />
        </main>
      );
      return (
        <main>
          <header className="container-wide" style={{ paddingBlock: '72px 40px', color: 'var(--intigris-off-white)' }}>
            <div className="eyebrow">{tx('SALES CLOUD · INTEGRATIONS SECTION', 'SALES CLOUD · KOPPELINGEN-SECTIE')}</div>
            <h1 style={{ color: 'var(--intigris-off-white)', fontSize: 'clamp(40px, 6vw, 80px)', fontWeight: 500, letterSpacing: '-.035em', lineHeight: 1, margin: '18px 0 14px' }}>{tx('Three ways to connect.', 'Drie manieren om te koppelen.')} <span style={{ color: 'var(--intigris-coral)', fontStyle: 'italic' }}>{tx('Pick one.', 'Kies er één.')}</span></h1>
            <p style={{ fontSize: 18, color: 'rgba(252,247,235,.8)', maxWidth: 680, margin: 0 }}>{tx('Scroll slowly through each one. A and C are driven by your scrolling; B plays by itself. Hover over a tool to see what the connection does.', 'Scroll rustig door elke variant. A en C bewegen mee met je scroll; B speelt vanzelf. Ga met je muis over een tool om te zien wat de koppeling doet.')}</p>
          </header>
          <HubLanding items={items} />
          <HubOrbit items={items} />
          <HubPlugIn items={items} />
          <div style={{ height: '40vh' }} />
          <CkStyles /><HvStyles />
        </main>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
