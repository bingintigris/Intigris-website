    /* Smooth-scroll to the hash once React has painted; native anchor jumps
       happen before <main> exists. Also tracks the target for highlighting. */
    function useHashTarget() {
      const [target, setTarget] = useState(() => (window.location.hash || '').slice(1));
      useEffect(() => {
        const go = () => {
          const id = (window.location.hash || '').slice(1);
          setTarget(id);
          if (!id) return;
          const el = document.getElementById(id);
          if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
        };
        go();
        window.addEventListener('hashchange', go);
        return () => window.removeEventListener('hashchange', go);
      }, []);
      return target;
    }

          `}</style>
        </main>
      );
    }

    function App() {
      const [lang, setLang] = useState('en');
      const [contactOpen, setContactOpen] = useState(false);
      function changeLang(l){ window.__lang = l; document.documentElement.setAttribute('lang', l); setLang(l); }
      function nav(r){
        if (r === 'contact') return setContactOpen(true);
        if (r === 'blog') return (window.location.href = 'Blog.html');
        if (r === 'about') return (window.location.href = 'About.html');
        if (r === 'home') return (window.location.href = 'index.html');
        return (window.location.href = 'index.html');
      }
      return (
        <>
          <SiteHeader overlay={true} megaTheme="cream" lang={lang} onLang={changeLang} onNav={nav} />
          <IndustriesPage key={'ind-' + lang} onCta={() => setContactOpen(true)} />
          <SiteNewsletter key={'nl-' + lang} />
          <SiteFooter key={'f-' + lang} />
          <SiteCookieConsent />
          <SiteContactSheet open={contactOpen} onClose={() => setContactOpen(false)} source="Industries.html" />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideRight { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</body>
</html>
