    function SelfCheck({ onCta }) {
      const [scores, setScores] = useState([]); // one score per answered question
      const [done, setDone] = useState(false);

      const step = scores.length;            // index of the current question
      const score = scores.reduce((a, b) => a + b, 0);
      const pct = Math.round((score / (total * 2)) * 100);

      function answer(s) {
        const next = [...scores, s];
        setScores(next);
        if (next.length === total) setDone(true);
      }
      function back() { setScores(s => s.slice(0, -1)); }
      function restart() { setScores([]); setDone(false); }

          </section>

          {/* HOW IT WORKS */}
          <section style={{ background: 'var(--intigris-coral)', paddingTop: 'clamp(64px, 8vw, 104px)', paddingBottom: 'clamp(64px, 8vw, 104px)' }}>
            <div className="container-wide">
              <div className="eyebrow" style={{ color: 'rgba(64,35,1,0.7)' }}>{tx('HOW IT WORKS', 'HOE HET WERKT')}</div>
              <h2 style={{ fontSize: 'clamp(30px,3.6vw,50px)', fontWeight: 500, letterSpacing: '-0.024em', lineHeight: 1.04, margin: '12px 0 40px', color: 'var(--intigris-dark-brown)' }}>
                {tx('From intake to ', 'Van intake tot ')}<span style={{ color: 'var(--intigris-off-white)', fontStyle: 'italic' }}>{tx('a plan you can act on.', 'een plan om mee aan de slag te gaan.')}</span>
              </h2>
              <div className="sc-steps" style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 18 }}>
                {STEPS.map((s, i) => (
                  <div key={i} style={{ background: 'var(--intigris-off-white)', border: '1px solid rgba(64,35,1,0.1)', borderRadius: 18, padding: '24px 22px' }}>
                    <div style={{ width: 40, height: 40, borderRadius: 999, background: 'var(--intigris-dark-brown)', color: 'var(--intigris-off-white)', display: 'grid', placeItems: 'center', fontSize: 15, fontWeight: 600 }}>{i + 1}</div>
                    <h3 style={{ fontSize: 18, fontWeight: 500, letterSpacing: '-0.014em', margin: '16px 0 8px', color: 'var(--intigris-dark-brown)' }}>{tx(s.en, s.nl)}</h3>
                    <p style={{ margin: 0, fontSize: 14.5, fontWeight: 400, lineHeight: 1.55, color: 'var(--fg-muted)' }}>{tx(s.dEn, s.dNl)}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* WHAT WE ASSESS */}
          <section className="container-wide" style={{ paddingTop: 'clamp(64px, 8vw, 104px)', paddingBottom: 'clamp(40px, 5vw, 56px)' }}>
            <div className="eyebrow" style={{ color: 'var(--intigris-coral)' }}>{tx('WHAT WE ASSESS', 'WAT WE BEOORDELEN')}</div>
            <h2 style={{ fontSize: 'clamp(28px,3.4vw,46px)', fontWeight: 500, letterSpacing: '-0.024em', lineHeight: 1.05, margin: '12px 0 34px', maxWidth: 640 }}>
              {tx('Six lenses on your business.', 'Zes invalshoeken op uw business.')}
            </h2>
            <div className="sc-assess" style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 18 }}>
              {ASSESS.map((a, i) => (
                <div key={i} style={{ background: 'var(--intigris-paper)', border: '1px solid var(--border)', borderRadius: 18, padding: '24px 24px' }}>
                  <div style={{ fontSize: 13, fontWeight: 600, letterSpacing: '0.04em', color: 'var(--intigris-coral-700)' }}>{String(i + 1).padStart(2, '0')}</div>
                  <h3 style={{ fontSize: 19, fontWeight: 500, letterSpacing: '-0.014em', margin: '8px 0 6px' }}>{tx(a.en, a.nl)}</h3>
                  <p style={{ margin: 0, fontSize: 15, fontWeight: 400, lineHeight: 1.5, color: 'var(--fg-muted)' }}>{tx(a.dEn, a.dNl)}</p>
                </div>
              ))}
            </div>
          </section>

          {/* SELF-CHECK */}
          <section className="container-wide" style={{ paddingTop: 'clamp(40px, 5vw, 64px)', paddingBottom: 'clamp(56px, 7vw, 88px)' }}>
            <div className="sc-two" style={{ display: 'grid', gridTemplateColumns: '0.85fr 1.15fr', gap: 'clamp(28px, 5vw, 56px)', alignItems: 'start' }}>
              <div>
                <div className="eyebrow" style={{ color: 'var(--intigris-coral)' }}>{tx('60-SECOND SELF-CHECK', '60-SECONDEN ZELFCHECK')}</div>
                <h2 style={{ fontSize: 'clamp(26px,3vw,42px)', fontWeight: 500, letterSpacing: '-0.022em', lineHeight: 1.06, margin: '12px 0 0' }}>
                  {tx('Get a quick read on your AI opportunity.', 'Krijg snel zicht op uw AI-kans.')}
                </h2>
                <p style={{ marginTop: 16, fontSize: 16.5, fontWeight: 400, lineHeight: 1.6, color: 'var(--fg-muted)', maxWidth: 360 }}>
                  {tx('Six quick questions, no email required. It’s a taster, the full scan goes far deeper.', 'Zes korte vragen, geen e-mail nodig. Het is een voorproefje, de volledige scan gaat veel dieper.')}
                </p>
              </div>
              <SelfCheck onCta={onScan} />
            </div>
          </section>

          {/* INVESTMENT */}
          <section className="container-wide" style={{ paddingBottom: 'clamp(56px, 7vw, 88px)' }}>
            <div className="sc-price" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 'clamp(28px, 5vw, 56px)', alignItems: 'center', background: 'var(--intigris-paper)', border: '1px solid var(--border)', borderRadius: 24, padding: 'clamp(28px, 4vw, 48px)' }}>
              <div>
                <div className="eyebrow" style={{ color: 'var(--intigris-coral)' }}>{tx('THE INVESTMENT', 'DE INVESTERING')}</div>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginTop: 14 }}>
                  <span style={{ fontSize: 'clamp(48px,6vw,72px)', fontWeight: 600, letterSpacing: '-0.03em', lineHeight: 1, color: 'var(--intigris-dark-brown)' }}>€2,000</span>
                  <span style={{ fontSize: 16, fontWeight: 500, color: 'var(--fg-muted)' }}>{tx('fixed', 'vast')}</span>
                </div>
                <p style={{ marginTop: 16, fontSize: 17, fontWeight: 400, lineHeight: 1.6, color: 'var(--intigris-dark-brown)', maxWidth: 420 }}>
                  {tx(
                    'And here’s the best part: if you decide to implement with us, the full €2,000 is deducted from your implementation cost. Effectively, the scan pays for itself.',
                    'En het mooiste: besluit u met ons te implementeren, dan wordt de volledige €2.000 verrekend met uw implementatiekosten. In feite verdient de scan zichzelf terug.'
                  )}
                </p>
                <button className="btn btn-primary btn-lg" onClick={onScan} style={{ marginTop: 24, color: 'var(--intigris-off-white)' }}>{tx('Request your scan', 'Vraag uw scan aan')} <span className="arrow">→</span></button>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                {[
                  tx('In-depth intake & organizational scan', 'Diepgaande intake & organisatiescan'),
                  tx('Fully written report in ~2 working days', 'Volledig rapport in ~2 werkdagen'),
                  tx('Opportunities prioritised as Must / Should / Could', 'Kansen geprioriteerd als Must / Should / Could'),
                  tx('Walkthrough of the findings with our team', 'Doorloop van de bevindingen met ons team'),
                  tx('Tailored implementation offer, no obligation', 'Implementatie-aanbod op maat, vrijblijvend'),
                  tx('€2,000 credited back if you proceed', '€2.000 terug verrekend als u doorgaat'),
                ].map((it, i) => (
                  <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 12, fontSize: 15.5, fontWeight: 400, color: 'var(--intigris-dark-brown)' }}>
                    <span aria-hidden style={{ flex: 'none', marginTop: 2, width: 20, height: 20, borderRadius: 999, background: 'rgba(76,105,58,0.16)', color: 'var(--intigris-washed-green)', display: 'grid', placeItems: 'center', fontSize: 12, fontWeight: 700 }}>✓</span>
                    {it}
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* SUCCESS STORIES */}
          <section style={{ background: 'var(--intigris-coral)', paddingTop: 'clamp(64px, 8vw, 104px)', paddingBottom: 'clamp(64px, 8vw, 104px)' }}>
            <div className="container-wide">
              <div className="eyebrow" style={{ color: 'rgba(64,35,1,0.7)' }}>{tx('SUCCESS STORIES', 'SUCCESVERHALEN')}</div>
              <h2 style={{ fontSize: 'clamp(30px,3.6vw,50px)', fontWeight: 500, letterSpacing: '-0.024em', lineHeight: 1.04, margin: '12px 0 40px', color: 'var(--intigris-dark-brown)' }}>
                {tx('Real starting points, real ', 'Echte startpunten, echte ')}<span style={{ color: 'var(--intigris-off-white)', fontStyle: 'italic' }}>{tx('time back.', 'tijdswinst.')}</span>
              </h2>
              <div className="sc-stories" style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 20 }}>
                {STORIES.map((s, i) => (
                  <div key={i} style={{ background: 'var(--intigris-off-white)', border: '1px solid rgba(64,35,1,0.1)', borderRadius: 20, padding: '26px 24px', display: 'flex', flexDirection: 'column' }}>
                    <div style={{ fontSize: 12, fontWeight: 600, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--fg-muted)' }}>{s.tag}</div>
                    <div style={{ fontSize: 26, fontWeight: 600, letterSpacing: '-0.02em', color: 'var(--intigris-coral-700)', margin: '10px 0 14px' }}>{s.metric}</div>
                    <p style={{ margin: 0, fontSize: 15.5, fontWeight: 400, fontStyle: 'italic', lineHeight: 1.55, color: 'var(--intigris-dark-brown)', flex: 1 }}>{tx(s.qEn, s.qNl)}</p>
                    <div style={{ marginTop: 18, fontSize: 13.5, fontWeight: 500, color: 'var(--fg-muted)' }}>{s.role}</div>
                  </div>
                ))}
              </div>
              <p style={{ marginTop: 22, fontSize: 13, color: 'rgba(64,35,1,0.6)' }}>{tx('Illustrative examples, real named client stories coming soon.', 'Illustratieve voorbeelden, echte klantverhalen met naam volgen binnenkort.')}</p>
            </div>
          </section>

          {/* WHY INTIGRIS */}
          <section className="container-wide" style={{ paddingTop: 'clamp(64px, 8vw, 104px)', paddingBottom: 'clamp(48px, 6vw, 72px)' }}>
            <div style={{ maxWidth: 780 }}>
              <div className="eyebrow" style={{ color: 'var(--intigris-coral)' }}>{tx('WHY INTIGRIS', 'WAAROM INTIGRIS')}</div>
              <h2 style={{ fontSize: 'clamp(28px,3.4vw,46px)', fontWeight: 500, letterSpacing: '-0.024em', lineHeight: 1.06, margin: '12px 0 0' }}>
                {tx('We don’t just advise. We build it too.', 'We adviseren niet alleen. We bouwen het ook.')}
              </h2>
              <p style={{ marginTop: 18, fontSize: 17.5, fontWeight: 400, lineHeight: 1.6, color: 'var(--fg-muted)', maxWidth: 660 }}>
                {tx(
                  'We’ve been implementing smart software since 2010. That means the scan isn’t a theoretical deck, every recommendation comes from people who can actually deliver it. Practical, honest about what AI should and shouldn’t do, and focused on outcomes you can measure.',
                  'We implementeren slimme software sinds 2010. Daardoor is de scan geen theoretisch deck, elke aanbeveling komt van mensen die het ook echt kunnen bouwen. Praktisch, eerlijk over wat AI wel en niet moet doen, en gericht op resultaat dat u kunt meten.'
                )}
              </p>
            </div>
          </section>

          {/* FAQ */}
          <section className="container-wide" style={{ paddingBottom: 'clamp(64px, 8vw, 96px)' }}>
            {/* Divider: closes off Why Intigris so the centered FAQ reads as its own section */}
            <div aria-hidden style={{ height: 1, background: 'var(--border)', marginBottom: 'clamp(46px, 5.5vw, 68px)' }} />
            <h2 style={{ fontSize: 'clamp(28px,3.4vw,44px)', fontWeight: 500, letterSpacing: '-0.024em', lineHeight: 1.05, margin: '0 0 28px', textAlign: 'center' }}>
              <span style={{ color: 'var(--intigris-coral)' }}>FAQ</span>
              <span aria-hidden style={{ color: 'var(--intigris-coral)', opacity: 0.55, margin: '0 0.34em' }}>·</span>
              <span style={{ color: 'var(--intigris-dark-brown)' }}>{tx('Good to know.', 'Goed om te weten.')}</span>
            </h2>
            <div style={{ background: 'var(--intigris-paper)', border: '1px solid var(--border)', borderRadius: 24, padding: '4px clamp(18px, 3vw, 34px)', maxWidth: 900, margin: '0 auto' }}>
              {FAQS.map((f, i) => <FaqItem key={i} q={tx(f.qEn, f.qNl)} a={tx(f.aEn, f.aNl)} last={i === FAQS.length - 1} />)}
            </div>
          </section>

          <style>{`
            .sc-opt { border: 1.5px solid var(--border); background: var(--intigris-off-white); color: var(--intigris-dark-brown);
              border-radius: 999px; padding: 9px 18px; font-family: inherit; font-size: 14.5px; font-weight: 500; cursor: pointer;
              transition: background 140ms var(--ease-out), border-color 140ms var(--ease-out), color 140ms var(--ease-out); }
            .sc-opt:hover { border-color: var(--intigris-coral); }
            .sc-opt[data-sel="1"] { background: var(--intigris-coral); border-color: var(--intigris-coral); color: var(--intigris-off-white); }
            @media (max-width: 900px) {
              .sc-hero-grid { grid-template-columns: 1fr !important; align-items: start !important; gap: 32px !important; }
              .sc-hero-grid > div:last-child { justify-self: start !important; }
            }
            @media (max-width: 960px) {
              .sc-two { grid-template-columns: 1fr !important; }
              .sc-moscow, .sc-assess, .sc-stories { grid-template-columns: 1fr !important; }
              .sc-steps { grid-template-columns: 1fr 1fr !important; }
              .sc-price { grid-template-columns: 1fr !important; }
            }
            @media (max-width: 560px) { .sc-steps { grid-template-columns: 1fr !important; } }
          `}</style>
        </main>
      );
    }

    function FaqItem({ q, a, last }) {
      const [open, setOpen] = useState(false);
      return (
        <div style={{ borderBottom: last ? 'none' : '1px solid var(--border)' }}>
          <button onClick={() => setOpen(o => !o)} style={{ width: '100%', textAlign: 'left', background: 'transparent', border: 0, cursor: 'pointer', padding: '20px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16, fontFamily: 'inherit' }}>
            <span style={{ fontSize: 17, fontWeight: 500, letterSpacing: '-0.012em', color: 'var(--intigris-dark-brown)' }}>{q}</span>
            <span aria-hidden style={{ flex: 'none', color: 'var(--intigris-coral)', fontSize: 22, lineHeight: 1, transform: open ? 'rotate(45deg)' : 'none', transition: 'transform 200ms var(--ease-out)' }}>+</span>
          </button>
          {open && <div style={{ padding: '0 0 20px', fontSize: 15.5, fontWeight: 400, lineHeight: 1.6, color: 'var(--fg-muted)', maxWidth: 720 }}>{a}</div>}
        </div>
      );
    }

    function App() {
      const [lang, setLang] = useState('en');
      const [contact, setContact] = useState(null);
      function changeLang(l){ window.__lang = l; setLang(l); }
      function nav(r){
        if (r === 'contact') return setContact({ subject: '', message: '' });
        if (r === 'blog') return (window.location.href = 'Blog.html');
        return (window.location.href = 'index.html');
      }
      const openScan = () => setContact({ subject: tx(SCAN_SUBJECT.en, SCAN_SUBJECT.nl), message: tx(SCAN_MESSAGE.en, SCAN_MESSAGE.nl) });
      return (
        <>
          <SiteHeader overlay={true} megaTheme="cream" lang={lang} onLang={changeLang} onNav={nav} />
          <Scan key={'scan-' + lang} onScan={openScan} />
          <SiteNewsletter key={'nl-' + lang} />
          <SiteFooter />
          <SiteCookieConsent />
          <SiteContactSheet open={contact !== null} onClose={() => setContact(null)} subject={contact?.subject} message={contact?.message} source="AIReadinessScan.html" />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideRight { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</body>
</html>
