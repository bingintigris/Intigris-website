<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intigris | Smarten up your business.</title>
  <link rel="stylesheet" href="design-system/site.css?v=1787048513000">
  <link rel="icon" href="assets/logo-coral.png">
  <script>
    /* Tiny i18n bootstrap, defined before component scripts load.
       Components call window.tx('English', 'Nederlands') and get the
       string matching window.__lang (default 'en'). The App state
       owns __lang; changing it re-keys <main> so children re-render. */
    window.__lang = 'en';
    window.tx = function (en, nl) { return window.__lang === 'nl' ? nl : en; };
    /* Public Supabase config (anon key is safe in the browser), used by the
       newsletter sign-up to save subscribers. */
    window.SUPABASE_URL = 'https://kzonefjyvaedaoodckmj.supabase.co';
    window.SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6b25lZmp5dmFlZGFvb2Rja21qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MjI2OTYsImV4cCI6MjEwMDI5ODY5Nn0.FZiSfRI1OxeJhHzZvF5rhVi-xJ5ut1TgFQBPRhskv54';
  </script>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script type="text/babel" src="components/tweaks-panel.jsx?v=1787048513000"></script>
  <script type="text/babel" src="components/Header.jsx?v=1787048513000"></script>
  <script type="text/babel" src="components/Hero.jsx?v=1787048513000"></script>
  <script type="text/babel" src="components/Showcase.jsx?v=1787048513000"></script>
  <script type="text/babel" src="components/Offerings.jsx?v=1787048513000"></script>
  <script type="text/babel" src="components/ClientStories.jsx?v=1787048513000"></script>
  <script type="text/babel" src="components/Industries.jsx?v=1787048513000"></script>
  <script type="text/babel" src="components/Services.jsx?v=1787048513000"></script>
  <script type="text/babel" src="components/Solutions.jsx?v=1787048513000"></script>
  <script type="text/babel" src="components/WhyIntigris.jsx?v=1787048513000"></script>
  <script type="text/babel" src="components/Pricing.jsx?v=1787048513000"></script>
  <script type="text/babel" src="components/Cases.jsx?v=1787048513000"></script>
  <script type="text/babel" src="components/Testimonial.jsx?v=1787048513000"></script>
  <script type="text/babel" src="components/ISA.jsx?v=1787048513000"></script>
  <script type="text/babel" src="components/Newsletter.jsx?v=1787048513000"></script>
  <script type="text/babel" src="components/ContactSheet.jsx?v=1787048513000"></script>
  <script type="text/babel" src="components/CookieConsent.jsx?v=1787048513000"></script>
  <script type="text/babel" src="components/Footer.jsx?v=1787048513000"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "hero": "cinematic",
      "industries": "tabs",
      "accent": "coral",
      "showProofMarquee": true,
      "darkExplore": false,
      "showPricing": false,
      "showCases": false,
      "showTestimonial": true,
      "showISA": false
    }/*EDITMODE-END*/;

    /* ------- App ------- */
    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [contactOpen, setContactOpen] = useState(false);
      const [lang, setLang] = useState('en');
      const [mode, setMode] = useState('ai'); // 'ai' (default) | 'salesforce'

      // Set window.__lang SYNCHRONOUSLY so the same render's tx() reads the new value.
      const changeLang = (next) => {
        window.__lang = next;
        document.documentElement.setAttribute('lang', next);
        setLang(next);
      };

      const openContact = () => setContactOpen(true);

      return (
        <>
          <SiteHeader
            overlay={t.hero === 'cinematic'}
            megaTheme="cream"
            onNav={(r) => {
              if (r === 'contact') return openContact();
              if (r === 'blog')    return (window.location.href = 'Blog.html');
              if (r === 'about')   return (window.location.href = 'About.html');
              if (r === 'home')    return window.scrollTo({ top: 0, behavior: 'smooth' });
            }}
            lang={lang}
            onLang={changeLang}
          />
          <main key={lang}>
            <SiteHero variant={t.hero} mood={t.darkExplore ? 'dark' : 'coral'} mode={mode} onMode={setMode} onCta={openContact} onSecondary={() => document.getElementById('cases')?.scrollIntoView({behavior:'smooth', block:'start'})} />

            {/* ===== Sections below the hero switch with the AI / Salesforce toggle ===== */}
            {mode === 'ai' ? (
              /* ---------- AI SOLUTIONS view (default) ---------- */
              <React.Fragment key="view-ai">
                <SiteShowcase onCta={openContact} />
                <SiteOfferings />
                <SiteClientStories />
                <SiteWhy />
                {t.showPricing && <SitePricing onCta={openContact} />}
                {t.showCases && <SiteCases />}
                {t.showTestimonial && <SiteTestimonial lang={lang} />}
                {t.showISA && <SiteISA />}
              </React.Fragment>
            ) : (
              /* ---------- SALESFORCE SOLUTIONS view (copy of AI for now, edit freely) ---------- */
              <React.Fragment key="view-salesforce">
                <SiteShowcase onCta={openContact} />
                <SiteOfferings />
                <SiteClientStories />
                <SiteWhy />
                {t.showPricing && <SitePricing onCta={openContact} />}
                {t.showCases && <SiteCases />}
                {t.showTestimonial && <SiteTestimonial lang={lang} />}
                {t.showISA && <SiteISA />}
              </React.Fragment>
            )}

            <SiteFinalCTA onCta={openContact} />
          </main>
          <SiteNewsletter key={'nl-'+lang} />
          <SiteFooter key={'f-'+lang} />
          <SiteCookieConsent />

          <SiteContactSheet open={contactOpen} onClose={() => setContactOpen(false)} source="index.html" />

          <TweaksPanel title="Home page tweaks">
            <TweakSection label="Hero" />
            <TweakRadio
              label="Style"
              value={t.hero}
              options={[
                { value: 'cinematic', label: 'Cinematic' },
                { value: 'split', label: 'Split' },
                { value: 'typographic', label: 'Type' },
                { value: 'editorial', label: 'Editorial' },
              ]}
              onChange={(v) => setTweak('hero', v)}
            />

            <TweakSection label="Explore" />
            <TweakToggle label="Dark hero + orange menus" value={t.darkExplore} onChange={(v) => setTweak('darkExplore', v)} />

            <TweakSection label="Sections" />
            <TweakToggle label="Pricing" value={t.showPricing} onChange={(v) => setTweak('showPricing', v)} />
            <TweakToggle label="Cases" value={t.showCases} onChange={(v) => setTweak('showCases', v)} />
            <TweakToggle label="Testimonial" value={t.showTestimonial} onChange={(v) => setTweak('showTestimonial', v)} />
            <TweakToggle label="ISA teaser" value={t.showISA} onChange={(v) => setTweak('showISA', v)} />
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideRight { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</body>
</html>
