<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intigris — Smarten up your business.</title>
  <link rel="stylesheet" href="design-system/site.css?v=1784731379000">
  <link rel="icon" href="assets/logo-coral.png">
  <script>
    /* Tiny i18n bootstrap — defined before component scripts load.
       Components call window.tx('English', 'Nederlands') and get the
       string matching window.__lang (default 'en'). The App state
       owns __lang; changing it re-keys <main> so children re-render. */
    window.__lang = 'en';
    window.tx = function (en, nl) { return window.__lang === 'nl' ? nl : en; };
  </script>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/tweaks-panel.jsx?v=1784731379000"></script>
  <script type="text/babel" src="components/Header.jsx?v=1784731379000"></script>
  <script type="text/babel" src="components/Hero.jsx?v=1784731379000"></script>
  <script type="text/babel" src="components/Showcase.jsx?v=1784731379000"></script>
  <script type="text/babel" src="components/Offerings.jsx?v=1784731379000"></script>
  <script type="text/babel" src="components/ClientStories.jsx?v=1784731379000"></script>
  <script type="text/babel" src="components/Industries.jsx?v=1784731379000"></script>
  <script type="text/babel" src="components/Services.jsx?v=1784731379000"></script>
  <script type="text/babel" src="components/Solutions.jsx?v=1784731379000"></script>
  <script type="text/babel" src="components/WhyIntigris.jsx?v=1784731379000"></script>
  <script type="text/babel" src="components/Pricing.jsx?v=1784731379000"></script>
  <script type="text/babel" src="components/Cases.jsx?v=1784731379000"></script>
  <script type="text/babel" src="components/Testimonial.jsx?v=1784731379000"></script>
  <script type="text/babel" src="components/ISA.jsx?v=1784731379000"></script>
  <script type="text/babel" src="components/Footer.jsx?v=1784731379000"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "hero": "cinematic",
      "industries": "tabs",
      "accent": "coral",
      "showProofMarquee": true,
      "darkExplore": false,
      "showPricing": false,
      "showCases": false,
      "showTestimonial": true,
      "showISA": false
    }/*EDITMODE-END*/;

    /* ------- Contact sheet (slides in from right) ------- */
    function ContactSheet({ open, onClose }) {
      const [sent, setSent] = useState(false);
      const tx = window.tx || ((en) => en);
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [onClose]);

      if (!open) return null;
      return (
        <div onClick={onClose} style={{
          position: 'fixed', inset: 0, zIndex: 200,
          background: 'rgba(64,35,1,0.42)',
          backdropFilter: 'blur(4px)',
          display: 'flex', justifyContent: 'flex-end',
          animation: 'fadeIn 220ms cubic-bezier(0.22,0.61,0.36,1)',
        }}>
          <div onClick={e => e.stopPropagation()} style={{
            background: 'var(--intigris-off-white)',
            width: '100%', maxWidth: 520, height: '100%',
            padding: 56, overflowY: 'auto',
            boxShadow: '-20px 0 60px rgba(0,0,0,0.18)',
            animation: 'slideRight 320ms cubic-bezier(0.22,0.61,0.36,1)',
            position: 'relative',
          }}>
            <button onClick={onClose} style={{
              position: 'absolute', top: 20, right: 20,
              width: 36, height: 36, borderRadius: 999,
              background: 'transparent', border: '1px solid var(--border)', cursor: 'pointer',
              color: 'var(--intigris-dark-brown)', fontSize: 18,
            }} aria-label="Close">×</button>

            {!sent ? (
              <>
                <div className="eyebrow" style={{ marginBottom: 16 }}>{tx('CONTACT · WE GOT YOU', 'CONTACT · WE ZIJN ER VOOR U')}</div>
                <h3 style={{ fontSize: 44, fontWeight: 500, letterSpacing: '-0.022em', lineHeight: 1.04, margin: 0 }}>
                  {tx("Let's ", 'Laten we ')}<span style={{ color: 'var(--intigris-coral)' }}>{tx('talk.', 'praten.')}</span>
                </h3>
                <p style={{ marginTop: 14, fontSize: 16, fontWeight: 300, color: 'var(--fg-muted)' }}>
                  {tx(
                    "Tell us briefly what you're working on. We'll get back within a working day.",
                    'Vertel ons kort waar u mee bezig bent. We reageren binnen één werkdag.'
                  )}
                </p>
                <form onSubmit={e => { e.preventDefault(); setSent(true); }} style={{ marginTop: 32, display: 'flex', flexDirection: 'column', gap: 14 }}>
                  <Field label={tx('Name', 'Naam')} placeholder="Anna de Vries" />
                  <Field label={tx('Work email', 'Zakelijk e-mailadres')} placeholder="u@uwbedrijf.nl" />
                  <Field label={tx('Company · role', 'Bedrijf · functie')} placeholder={tx('Operations Director at …', 'Operations Director bij …')} />
                  <Field label={tx('What can we help with?', 'Waar kunnen we u mee helpen?')} placeholder={tx('Salesforce implementation, integration, field service…', 'Salesforce-implementatie, integratie, field service…')} multiline />
                  <button type="submit" className="btn btn-primary btn-lg" style={{ alignSelf: 'flex-start', marginTop: 12 }}>
                    {tx('Send', 'Verstuur')} <span className="arrow">→</span>
                  </button>
                </form>
              </>
            ) : (
              <>
                <div className="eyebrow" style={{ marginBottom: 16 }}>{tx('THANK YOU', 'BEDANKT')}</div>
                <h3 style={{ fontSize: 44, fontWeight: 500, letterSpacing: '-0.022em', lineHeight: 1.04, margin: 0 }}>
                  {tx('We got you.', 'We zijn er voor u.')} <span style={{ color: 'var(--intigris-coral)' }}>→</span>
                </h3>
                <p style={{ marginTop: 14, fontSize: 16, fontWeight: 300, color: 'var(--fg-muted)' }}>
                  {tx(
                    'Your submission has been received. An Intigrant will reach out within a working day.',
                    'We hebben uw bericht ontvangen. Een Intigrant neemt binnen één werkdag contact met u op.'
                  )}
                </p>
                <button onClick={onClose} className="btn btn-secondary" style={{ marginTop: 28 }}>
                  {tx('Back to the site', 'Terug naar de site')}
                </button>
              </>
            )}
          </div>
        </div>
      );
    }

    function Field({ label, placeholder, multiline }) {
      const Tag = multiline ? 'textarea' : 'input';
      return (
        <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <span className="eyebrow eyebrow--bare">{label}</span>
          <Tag
            placeholder={placeholder}
            rows={multiline ? 4 : undefined}
            style={{
              fontFamily: 'inherit', fontSize: 16, fontWeight: 300,
              color: 'var(--intigris-dark-brown)',
              minHeight: multiline ? 110 : 50,
              padding: multiline ? '14px 16px' : '0 16px',
              background: 'var(--intigris-paper)',
              border: '1.5px solid var(--border)',
              borderRadius: 10,
              outline: 'none',
              resize: 'vertical',
            }}
          />
        </label>
      );
    }

    /* ------- App ------- */
    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [contactOpen, setContactOpen] = useState(false);
      const [lang, setLang] = useState('en');

      // Set window.__lang SYNCHRONOUSLY so the same render's tx() reads the new value.
      const changeLang = (next) => {
        window.__lang = next;
        document.documentElement.setAttribute('lang', next);
        setLang(next);
      };

      const openContact = () => setContactOpen(true);

      return (
        <>
          <SiteHeader
            overlay={t.hero === 'cinematic'}
            megaTheme="cream"
            onNav={(r) => {
              if (r === 'contact') return openContact();
              if (r === 'blog')    return (window.location.href = 'Blog.html');
              if (r === 'about')   return (window.location.href = 'About.html');
              if (r === 'home')    return window.scrollTo({ top: 0, behavior: 'smooth' });
            }}
            lang={lang}
            onLang={changeLang}
          />
          <main key={lang}>
            <SiteHero variant={t.hero} mood={t.darkExplore ? 'dark' : 'coral'} onCta={openContact} onSecondary={() => document.getElementById('cases')?.scrollIntoView({behavior:'smooth', block:'start'})} />
            <SiteShowcase onCta={openContact} />
            <SiteOfferings />
            <SiteClientStories />
            <SiteWhy />
            {t.showPricing && <SitePricing onCta={openContact} />}
            {t.showCases && <SiteCases />}
            {t.showTestimonial && <SiteTestimonial lang={lang} />}
            {t.showISA && <SiteISA />}
            <SiteFinalCTA onCta={openContact} />
          </main>
          <SiteFooter key={'f-'+lang} />

          <ContactSheet open={contactOpen} onClose={() => setContactOpen(false)} />

          <TweaksPanel title="Home page tweaks">
            <TweakSection label="Hero" />
            <TweakRadio
              label="Style"
              value={t.hero}
              options={[
                { value: 'cinematic', label: 'Cinematic' },
                { value: 'split', label: 'Split' },
                { value: 'typographic', label: 'Type' },
                { value: 'editorial', label: 'Editorial' },
              ]}
              onChange={(v) => setTweak('hero', v)}
            />

            <TweakSection label="Explore" />
            <TweakToggle label="Dark hero + orange menus" value={t.darkExplore} onChange={(v) => setTweak('darkExplore', v)} />

            <TweakSection label="Sections" />
            <TweakToggle label="Pricing" value={t.showPricing} onChange={(v) => setTweak('showPricing', v)} />
            <TweakToggle label="Cases" value={t.showCases} onChange={(v) => setTweak('showCases', v)} />
            <TweakToggle label="Testimonial" value={t.showTestimonial} onChange={(v) => setTweak('showTestimonial', v)} />
            <TweakToggle label="ISA teaser" value={t.showISA} onChange={(v) => setTweak('showISA', v)} />
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideRight { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</body>
</html>
