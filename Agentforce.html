            /* ---------- use cases ---------- */
            .af-cases { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
            .af-case { background: var(--intigris-off-white); border-radius: var(--radius-xl); padding: clamp(22px, 2.8vw, 32px); display: flex; flex-direction: column; gap: 10px; }
            .af-case-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
            .af-credits { font-size: 12px; font-weight: 600; letter-spacing: .04em; padding: 5px 10px; border-radius: 999px; background: var(--intigris-coral); color: var(--intigris-dark-brown); white-space: nowrap; }
            .af-case h3 { margin: 4px 0 0; font-size: clamp(22px, 2.2vw, 28px); font-weight: 500; letter-spacing: -.02em; line-height: 1.1; color: var(--intigris-dark-brown); }
            .af-case p { margin: 0; font-size: 15.5px; line-height: 1.55; color: var(--fg-muted); }
            .af-note { margin: 18px 0 0; max-width: 820px; font-size: 13.5px; line-height: 1.55; color: var(--intigris-dark-brown); }

            /* ---------- five steps ---------- */
            .af-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
            .af-steps li { background: var(--intigris-paper); border: 1px solid var(--border); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
            .af-step-num { font-size: 12px; font-weight: 600; letter-spacing: .12em; color: var(--intigris-coral-700); }
            .af-steps b { font-size: 18px; font-weight: 500; letter-spacing: -.014em; line-height: 1.2; }
            .af-steps p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--fg-muted); }

            /* ---------- result + offer (shared with SalesCloud.html) ---------- */
            .sc-ba-col { border-radius: var(--radius-xl); padding: clamp(22px, 2.8vw, 34px); }
            .sc-ba-col--after { position: relative; overflow: hidden; color: #fff; background: var(--intigris-coral); border: 1px solid var(--intigris-coral); box-shadow: 0 24px 60px -40px rgba(255,95,54,.55); }
            .sc-ba-label { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 18px; color: rgba(255,255,255,.85); }
            .sc-ba-col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
            .sc-ba-col li { display: flex; gap: 12px; align-items: flex-start; font-size: 15.5px; line-height: 1.45; }
            .sc-ba-check { width: 22px; height: 22px; border-radius: 999px; background: rgba(255,255,255,.92); color: var(--intigris-coral-700); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; margin-top: 3px; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
            .sc-ba-col--after li div { display: flex; flex-direction: column; gap: 5px; }
            .sc-ba-col--after li b { font-weight: 500; letter-spacing: -.015em; color: #fff; font-size: 21px; line-height: 1.25; }
            .sc-ba-col--after li span { font-size: 14px; color: var(--intigris-dark-brown); }
            .sc-offers { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: stretch; }
            .sc-offer { background: var(--intigris-off-white-200); border: 1px solid var(--intigris-brown-100); border-radius: var(--radius-xl); padding: clamp(24px, 3vw, 36px); display: flex; flex-direction: column; gap: 18px; }
            .sc-offer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
            .sc-offer h3 { font-size: clamp(32px, 3.2vw, 44px); font-weight: 500; letter-spacing: -.02em; line-height: 1.05; margin: 10px 0 0; }
            .sc-offer > p { margin: 0; font-size: 15.5px; line-height: 1.6; color: var(--fg-muted); }
            .sc-offer-badge { flex: none; font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; background: var(--intigris-coral); color: var(--intigris-dark-brown); }
            .sc-offer-inc { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; line-height: 1.5; color: var(--intigris-dark-brown); flex: 1; }
            .sc-offer-inc small { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-muted); font-weight: 600; }
            .sc-offer-inc a { color: var(--intigris-coral-700); }

            /* ---------- faq (shared with SalesCloud.html) ---------- */
            .sc-faq-grid { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: clamp(28px, 5vw, 72px); align-items: start; }
            .sc-faq { border-top: 1px solid var(--border); }
            .sc-faq-item { border-bottom: 1px solid var(--border); }
            .sc-faq-item button { appearance: none; background: none; border: 0; width: 100%; text-align: left; padding: 20px 0; display: flex; justify-content: space-between; align-items: center; gap: 20px; cursor: pointer; font: inherit; font-size: 18px; font-weight: 500; letter-spacing: -.012em; color: var(--intigris-dark-brown); }
            .sc-faq-item button i { font-style: normal; color: var(--intigris-coral); font-size: 22px; line-height: 1; flex: none; }
            .sc-faq-item p { margin: 0 0 22px; font-size: 15.5px; line-height: 1.6; color: var(--fg-muted); max-width: 640px; }
            .sc-faq-item.is-open button { color: var(--intigris-coral); }

            /* ---------- responsive ---------- */
            @media (max-width: 1100px) { .af-steps { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
            @media (max-width: 980px) {
              .sc-hero-grid, .sc-offers, .sc-faq-grid, .af-stats { grid-template-columns: 1fr; }
              .sc-hero-grid { align-items: start; } .af-price { justify-self: start; }
            }
            @media (max-width: 720px) { .af-cases, .af-steps { grid-template-columns: 1fr; } }
          `}</style>
        </main>
      );
    }

    /* ?lang=nl opens the page in Dutch (e.g. links from Dutch campaigns). */
    const START_LANG = new URLSearchParams(window.location.search).get('lang') === 'nl' ? 'nl' : 'en';
    window.__lang = START_LANG;
    document.documentElement.setAttribute('lang', START_LANG);

    function App() {
      const [lang, setLang] = useState(START_LANG);
      const [contactOpen, setContactOpen] = useState(false);
      function changeLang(l){ window.__lang = l; document.documentElement.setAttribute('lang', l); setLang(l); }
      function nav(r){
        if (r === 'contact') return setContactOpen(true);
        return (window.location.href = 'index.html');
      }
      return (
        <>
          <SiteHeader overlay={true} megaTheme="cream" lang={lang} onLang={changeLang} onNav={nav} />
          <AgentforcePage key={'af-' + lang} onCta={() => setContactOpen(true)} />
          <SiteNewsletter key={'nl-' + lang} />
          <SiteFooter key={'f-' + lang} />
          <SiteCookieConsent />
          <SiteContactSheet open={contactOpen} onClose={() => setContactOpen(false)} source="Agentforce.html" />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
