<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klantverhalen carrousel: 3 varianten | Intigris</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="design-system/site.css?v=1789000000001">
  <link rel="icon" href="assets/logo-coral.png">
  <script>
    window.__lang = new URLSearchParams(window.location.search).get('lang') === 'en' ? 'en' : 'nl';
    window.tx = function (en, nl) { return window.__lang === 'nl' ? nl : en; };
  </script>
</head>
<body style="background: var(--intigris-brown-700); margin: 0;">
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script type="text/babel" src="components/CloudKit.jsx?v=1789000000001"></script>
  <script type="text/babel" src="components/StoryCarousel.jsx?v=1789000000001"></script>
  <script type="text/babel">
    const ONLY = new URLSearchParams(window.location.search).get('only'); /* ?only=1|2|3 */
    const Label = ({ n, text, light }) => (
      <div style={{ display: 'inline-flex', alignItems: 'center', gap: 12, fontSize: 15, marginBottom: 26, color: light ? 'var(--intigris-off-white)' : 'var(--intigris-brown-700)' }}>
        <span style={{ width: 34, height: 34, borderRadius: '50%', background: light ? 'var(--intigris-coral)' : 'var(--intigris-brown-700)', color: light ? 'var(--intigris-brown-700)' : 'var(--intigris-off-white)', display: 'grid', placeItems: 'center', fontWeight: 700 }}>{n}</span> {text}
      </div>
    );
    function App() {
      const S = CK_STORIES();
      const stories = [S.wetransfer, S.evbox, S.zon365, S.opcharge, S.alpha];
      const head = { eyebrow: tx('CUSTOMER SUCCESS STORIES', 'KLANTSUCCESVERHALEN'), a: tx('Teams that run on it.', 'Teams die erop draaien.'), b: '' };
      const show = k => !ONLY || ONLY === k;
      return (
        <main>
          {!ONLY && (
            <header className="container-wide" style={{ paddingBlock: '72px 40px', color: 'var(--intigris-off-white)' }}>
              <div className="eyebrow">{tx('SALES CLOUD · CUSTOMER STORIES', 'SALES CLOUD · KLANTSUCCESVERHALEN')}</div>
              <h1 style={{ color: 'var(--intigris-off-white)', fontSize: 'clamp(40px, 6vw, 80px)', fontWeight: 500, letterSpacing: '-.035em', lineHeight: 1, margin: '18px 0 14px' }}>{tx('One carousel, three looks.', 'Eén carrousel, drie looks.')} <span style={{ color: 'var(--intigris-coral)', fontStyle: 'italic' }}>{tx('Pick one.', 'Kies er één.')}</span></h1>
              <p style={{ fontSize: 18, color: 'rgba(252,247,235,.8)', maxWidth: 700, margin: 0 }}>{tx('Each one moves on slowly by itself. Hover to pause; drag, click a side card or use the arrows to browse.', 'Elke variant schuift langzaam vanzelf door. Ga erop staan om te pauzeren; sleep, klik op een kaart aan de zijkant of gebruik de pijlen.')}</p>
            </header>
          )}
          {show('1') && <StoryCarousel variant="cover" head={head} stories={stories} label={<Label n="1" light text={tx('Coverflow: side cards turn away in 3D', 'Coverflow: kaarten aan de zijkant draaien weg in 3D')} />} />}
          {show('2') && <StoryCarousel variant="fan" head={head} stories={stories} label={<Label n="2" text={tx('Fan: a hand of cards on coral', 'Waaier: een hand kaarten op koraal')} />} />}
          {show('3') && <StoryCarousel variant="depth" head={head} stories={stories} label={<Label n="3" text={tx('Depth: flat cards, a colour per customer', 'Diepte: platte kaarten, een kleur per klant')} />} />}
          <CkStyles /><ScStyles />
        </main>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
