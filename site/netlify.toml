# Netlify: the existing site (intigris.netlify.app) builds from branch main with
# base directory "site" (Site configuration > Build & deploy > Base directory).
# Every pull request gets its own deploy preview (never indexed, see below).
[build]
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  ASTRO_TELEMETRY_DISABLED = "1"

# Deploy previews and branch deploys are never indexed
[context.deploy-preview.environment]
  PUBLIC_NOINDEX = "true"
[context.branch-deploy.environment]
  PUBLIC_NOINDEX = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
