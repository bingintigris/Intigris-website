    /* Smooth-scroll to the hash once React has painted, and mark the target
       so the eye lands on it. Native anchor jumps happen before <main> exists. */
    function useHashTarget() {
      const [target, setTarget] = useState(() => (window.location.hash || '').slice(1));
      useEffect(() => {
        const go = () => {
          const id = (window.location.hash || '').slice(1);
          setTarget(id);
          if (!id) return;
          const el = document.getElementById(id);
          if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
        };
        go();
        window.addEventListener('hashchange', go);
        return () => window.removeEventListener('hashchange', go);
      }, []);
      return target;
    }

      const Glyph = window.ProductGlyph || (() => null);
      return (
        <section id="products" style={{ background: 'var(--intigris-chocolate)', color: 'var(--intigris-off-white)', paddingTop: 'clamp(64px, 8vw, 112px)', paddingBottom: 'clamp(64px, 8vw, 112px)', scrollMarginTop: 72 }}>
          <div className="container-wide">
            <div className="section-head">
              <div>
                <div className="eyebrow" style={{ marginBottom: 20, color: 'var(--intigris-coral)' }}>{tx('WHAT WE IMPLEMENT', 'WAT WE IMPLEMENTEREN')}</div>
                <h2 className="display-md" style={{ color: 'var(--intigris-off-white)' }}>
                  {tx('Across the ', 'Op de hele ')}<span style={{ color: 'var(--intigris-coral)' }}>{tx('Salesforce stack.', 'Salesforce-stack.')}</span>
                </h2>
              </div>
              <p className="lede" style={{ color: 'rgba(252,247,235,0.82)' }}>
                {tx(
                  'The products we deliver most often. Configured, integrated and running in production at our clients, not just on a slide.',
                  'De producten die we het vaakst opleveren. Geconfigureerd, geïntegreerd en in productie bij onze klanten, niet alleen op een slide.'
                )}
              </p>
            </div>

            <div className="svc-products">
              {list.map((p) => {
                const c = PRODUCT_COPY[p.id] || {};
                const hit = target === p.id;
                return (
                  <article key={p.id} id={p.id} className={'svc-product' + (hit ? ' is-target' : '')} style={{ scrollMarginTop: 112 }}>
                    <div className="svc-product-head">
                      <div className="svc-product-icon"><Glyph id={p.id} /></div>
                      <span className="svc-product-num">{p.num}</span>
                    </div>
                    <h3 style={{ fontSize: 24, fontWeight: 500, letterSpacing: '-0.02em', lineHeight: 1.1, margin: '18px 0 0', color: 'var(--intigris-off-white)' }}>{productName(p.id)}</h3>
                    <p style={{ margin: '10px 0 0', fontSize: 15, fontWeight: 400, lineHeight: 1.5, color: 'rgba(252,247,235,0.8)' }}>{c.blurb ? tx(c.blurb[0], c.blurb[1]) : p.blurb}</p>
                    <ul style={{ listStyle: 'none', margin: '18px 0 0', padding: '16px 0 0', borderTop: '1px solid rgba(252,247,235,0.14)', display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {(c.bullets || p.bullets.map(b => [b, b])).map((b, i) => (
                        <li key={i} style={{ display: 'flex', gap: 10, alignItems: 'flex-start', fontSize: 14, fontWeight: 400, lineHeight: 1.45, color: 'rgba(252,247,235,0.9)' }}>
                          <span aria-hidden style={{ color: 'var(--intigris-coral)', flex: 'none', lineHeight: 1.45 }}>→</span>{tx(b[0], b[1])}
                        </li>
                      ))}
                    </ul>
                  </article>
                );
              })}
            </div>
          </div>
        </section>
      );
    }

    function Process() {
      return (
        <section id="process" className="container-wide" style={{ paddingTop: 'clamp(64px, 8vw, 112px)', paddingBottom: 'clamp(64px, 8vw, 112px)', scrollMarginTop: 72 }}>
          <div className="section-head">
            <div>
              <div className="eyebrow" style={{ marginBottom: 20 }}>{tx('OUR PROCESS', 'ONZE AANPAK')}</div>
              <h2 className="display-md">
                {tx('Waterfall to agree. ', 'Waterval om af te spreken. ')}<span style={{ color: 'var(--intigris-coral)' }}>{tx('Agile to deliver.', 'Agile om op te leveren.')}</span>
              </h2>
            </div>
            <p className="lede">
              {tx(
                'We start like waterfall: analysis and a global design that pins down cost, lead time and solution while leaving room for detail. Then we build and deliver agile, in sprints. Expectations stay clear and we stay flexible.',
                'We starten als waterval: analyse en een globaal ontwerp dat kosten, doorlooptijd en oplossing vastlegt en ruimte laat voor detail. Daarna bouwen en leveren we agile, in sprints. Verwachtingen blijven helder en wij blijven wendbaar.'
              )}
            </p>
          </div>

          <ol className="svc-process" style={{ listStyle: 'none', margin: 0, padding: 0 }}>
            {PROCESS.map((s, i) => (
              <li key={i} className="svc-step">
                <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 12 }}>
                  <span style={{ fontSize: 13, fontWeight: 600, letterSpacing: '0.14em', color: 'var(--intigris-coral-700)' }}>{String(i + 1).padStart(2, '0')}</span>
                  {i < PROCESS.length - 1 && <span aria-hidden className="svc-step-arrow">→</span>}
                </div>
                <h3 style={{ fontSize: 24, fontWeight: 500, letterSpacing: '-0.018em', margin: '14px 0 10px' }}>{tx(s.en, s.nl)}</h3>
                <p style={{ margin: 0, fontSize: 15, fontWeight: 400, lineHeight: 1.55, color: 'var(--fg-muted)' }}>{tx(s.dEn, s.dNl)}</p>
              </li>
            ))}
          </ol>
        </section>
      );
    }

    function ServicesPage({ onCta }) {
      const target = useHashTarget();
      return (
        <main style={{ background: 'var(--intigris-off-white)' }}>
          <ServicesHero onCta={onCta} />
          <SubNav target={target} />
          <Engagements onCta={onCta} target={target} />
          <Products target={target} />
          <Process />
          <SiteFinalCTA onCta={onCta} />
          <style>{`
            .svc-chip { text-decoration: none; cursor: pointer; transition: background 160ms var(--ease-out), color 160ms var(--ease-out), border-color 160ms var(--ease-out); }
            .svc-chip:hover { background: var(--intigris-coral); color: var(--intigris-dark-brown); border-color: var(--intigris-coral); }

            .svc-subnav { position: sticky; top: 0; z-index: 30; background: rgba(252,247,235,0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
            .svc-subnav-inner { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-top: 10px; padding-bottom: 10px; }
            .svc-subnav-inner::-webkit-scrollbar { display: none; }
            .svc-subnav-link { flex: none; font-size: 14px; font-weight: 500; letter-spacing: -0.005em; color: var(--intigris-dark-brown); text-decoration: none; padding: 8px 14px; border-radius: 999px; transition: background 160ms var(--ease-out), color 160ms var(--ease-out); }
            .svc-subnav-link:hover { background: var(--intigris-off-white-200); }
            .svc-subnav-link.is-active { background: var(--intigris-dark-brown); color: var(--intigris-off-white); }

            .svc-row.is-target h3 { color: var(--intigris-coral); }

            .svc-products { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
            .svc-product { background: rgba(252,247,235,0.05); border: 1px solid rgba(252,247,235,0.16); border-radius: var(--radius-xl); padding: 26px 24px; transition: border-color 220ms var(--ease-out), background 220ms var(--ease-out), transform 220ms var(--ease-out); }
            .svc-product:hover { border-color: rgba(252,247,235,0.36); transform: translateY(-3px); }
            .svc-product.is-target { border-color: var(--intigris-coral); background: rgba(255,95,54,0.1); }
            .svc-product-head { display: flex; align-items: center; justify-content: space-between; }
            .svc-product-icon { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--intigris-coral); color: var(--intigris-dark-brown); }
            .svc-product-num { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: rgba(252,247,235,0.55); }

            .svc-process { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
            .svc-step { background: var(--intigris-paper); border: 1px solid var(--border); border-radius: 20px; padding: 26px 26px 28px; }
            .svc-step-arrow { color: var(--intigris-coral); font-size: 16px; }

            @media (max-width: 1100px) { .svc-products { grid-template-columns: repeat(2, minmax(0,1fr)); } }
            @media (max-width: 980px) {
              .svc-hero-grid { grid-template-columns: 1fr !important; align-items: start !important; }
              .svc-hero-grid > div:last-child { justify-self: start !important; }
              .svc-row { grid-template-columns: 1fr !important; gap: 20px !important; }
              .svc-process { grid-template-columns: repeat(2, minmax(0,1fr)); }
            }
            @media (max-width: 620px) {
              .svc-products, .svc-process { grid-template-columns: 1fr; }
            }
          `}</style>
        </main>
      );
    }

    function App() {
      const [lang, setLang] = useState('en');
      const [contactOpen, setContactOpen] = useState(false);
      function changeLang(l){ window.__lang = l; document.documentElement.setAttribute('lang', l); setLang(l); }
      function nav(r){
        if (r === 'contact') return setContactOpen(true);
        if (r === 'blog') return (window.location.href = 'Blog.html');
        if (r === 'about') return (window.location.href = 'About.html');
        if (r === 'home') return (window.location.href = 'index.html');
        return (window.location.href = 'index.html');
      }
      return (
        <>
          <SiteHeader overlay={true} megaTheme="cream" lang={lang} onLang={changeLang} onNav={nav} />
          <ServicesPage key={'svc-' + lang} onCta={() => setContactOpen(true)} />
          <SiteNewsletter key={'nl-' + lang} />
          <SiteFooter key={'f-' + lang} />
          <SiteCookieConsent />
          <SiteContactSheet open={contactOpen} onClose={() => setContactOpen(false)} source="Services.html" />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideRight { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</body>
</html>
