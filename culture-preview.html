    const { useState } = React;

    const PILLARS = [
      { en: 'Ownership', nl: 'Eigenaarschap',
        dEn: 'At Intigris you gain swift responsibility for projects and clients. We believe you’re capable of more than you think, and taking the lead fosters rapid learning. Colleagues are there to assist, but embrace responsibility, hold high standards, and always seek improvement.',
        dNl: 'Bij Intigris krijg je snel verantwoordelijkheid voor projecten en klanten. We geloven dat je meer kunt dan je denkt, en het voortouw nemen zorgt voor snelle groei. Collega’s helpen je, maar neem verantwoordelijkheid, hanteer hoge standaarden en blijf verbeteren.',
        qEn: 'Bring forth new ideas and be proactive in your approach.', qNl: 'Kom met nieuwe ideeën en wees proactief.' },
      { en: 'Craftsmanship', nl: 'Vakmanschap',
        dEn: 'We love our profession, finding joy in software and complex challenges. You’ll collaborate with smart, dedicated colleagues that make work fulfilling. Though not mandatory, we expect you to master your craft, continuously developing your skills.',
        dNl: 'We houden van ons vak en vinden plezier in software en complexe uitdagingen. Je werkt samen met slimme, toegewijde collega’s die werk waardevol maken. Het is niet verplicht, maar we verwachten dat je je vak beheerst en jezelf blijft ontwikkelen.',
        qEn: 'Stay curious and keep striving for improvements.', qNl: 'Blijf nieuwsgierig en streef naar verbetering.' },
      { en: 'Autonomy', nl: 'Autonomie',
        dEn: 'For us Intigrants, autonomy is vital. Value your own space and standing within the organization. Embrace unique qualities, forming and expressing opinions. Learn from diverse people and involve clients in your vision, guiding them towards progress.',
        dNl: 'Voor ons Intigranten is autonomie essentieel. Waardeer je eigen ruimte en positie binnen de organisatie. Omarm unieke kwaliteiten, vorm en uit meningen. Leer van verschillende mensen en betrek klanten bij je visie richting vooruitgang.',
        qEn: 'Trust in your vision and take others along with you.', qNl: 'Vertrouw op je visie en neem anderen mee.' },
    ];

    const BELIEFS = [
      { en: 'Help each other', nl: 'Help elkaar', dEn: 'Don’t just do your own job, also make sure you help your colleagues do theirs.', dNl: 'Doe niet alleen je eigen werk, maar help ook je collega’s met dat van hen.' },
      { en: 'Professional with a sense of humor', nl: 'Professioneel met humor', dEn: 'Take both your job and having fun seriously.', dNl: 'Neem zowel je werk als plezier serieus.' },
      { en: 'Raise the bar', nl: 'Leg de lat hoog', dEn: 'Always try to exceed our clients’ expectations, happy customers drive our success.', dNl: 'Overtref altijd de verwachtingen van klanten, tevreden klanten bepalen ons succes.' },

            <div className="eyebrow" style={{ color: 'var(--intigris-coral)' }}>{tx('OUR WORK & CULTURE', 'ONS WERK & ONZE CULTUUR')}</div>

                  <h3 style={{ fontSize: 26, fontWeight: 500, letterSpacing: '-0.018em', margin: '10px 0 12px' }}>{tx(p.en, p.nl)}</h3>
                  <p style={{ margin: 0, fontSize: 15.5, fontWeight: 400, lineHeight: 1.6, color: 'var(--fg-muted)', flex: 1 }}>{tx(p.dEn, p.dNl)}</p>

              <div className="eyebrow" style={{ color: 'var(--intigris-coral)' }}>{tx('LIFE IS MORE THAN JUST WORK', 'ER IS MEER DAN WERK')}</div>
              <h2 style={{ fontSize: 'clamp(30px,3.6vw,48px)', fontWeight: 500, letterSpacing: '-0.024em', lineHeight: 1.04, margin: '12px 0 0' }}>

            </div>
            <div>
              <div className="eyebrow" style={{ color: 'var(--intigris-coral)' }}>{tx('OUR STORY', 'ONS VERHAAL')}</div>
              <h2 style={{ fontSize: 'clamp(30px,3.6vw,48px)', fontWeight: 500, letterSpacing: '-0.024em', lineHeight: 1.04, margin: '12px 0 0' }}>
                {tx('From a passion for technology to a team of smart people.', 'Van passie voor technologie naar een team van slimme mensen.')}

              <p style={{ marginTop: 18, fontSize: 17, fontWeight: 400, lineHeight: 1.6, color: 'var(--fg-muted)', maxWidth: 520 }}>
                {tx(
                  'Founder Hans Nieuwenhuis worked for about ten years as a business consultant in telecom after studying electrical engineering at Delft University of Technology. In 2009 it was time to do what he likes best. Driven by a love for advanced technology, he founded Intigris with a clear goal: helping organizations improve through smart software.',
                  'Oprichter Hans Nieuwenhuis werkte zo’n tien jaar als business consultant in de telecom, na zijn studie elektrotechniek aan de TU Delft. In 2009 werd het tijd om te doen waar hij het meest van houdt. Gedreven door een liefde voor geavanceerde technologie richtte hij Intigris op, met één duidelijk doel: organisaties helpen verbeteren met slimme software.'
                )}
              </p>
              <p style={{ marginTop: 14, fontSize: 17, fontWeight: 400, lineHeight: 1.6, color: 'var(--fg-muted)', maxWidth: 520 }}>
                {tx(
                  'Today, Intigris works with a team of smart consultants and developers from the Kraanspoor building on the creative NDSM wharf in Amsterdam-Noord.',

            </div>
          </section>

            <div className="eyebrow" style={{ color: 'var(--intigris-coral)' }}>{tx('EXPLORE MORE', 'ONTDEK MEER')}</div>
            <div className="cul-explore" style={{ marginTop: 22, display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 20 }}>
              {EXPLORE.map((c) => (
                <a key={c.id} href={c.href} className="cul-card" style={{ display: 'flex', flexDirection: 'column', gap: 8, textDecoration: 'none', color: 'inherit', background: 'var(--intigris-paper)', border: '1px solid var(--border)', borderRadius: 18, padding: '26px 26px 22px' }}>
                  <h3 style={{ fontSize: 21, fontWeight: 500, letterSpacing: '-0.014em', margin: 0 }}>{tx(c.en, c.nl)}</h3>
                  <p style={{ margin: 0, fontSize: 15, fontWeight: 400, lineHeight: 1.5, color: 'var(--fg-muted)', flex: 1 }}>{tx(c.dEn, c.dNl)}</p>
                  <span className="cul-more" style={{ marginTop: 6, fontSize: 14, fontWeight: 500, color: 'var(--intigris-coral-700)' }}>{tx('Read more', 'Lees meer')} <span aria-hidden>→</span></span>
                </a>
              ))}
            </div>
          </section>

          <style>{`
            .cul-card { transition: transform 160ms var(--ease-out), box-shadow 160ms var(--ease-out), border-color 160ms var(--ease-out); }
            .cul-card:hover { transform: translateY(-3px); box-shadow: 0 18px 40px rgba(64,35,1,0.10); border-color: var(--intigris-coral); }
            .cul-card:hover .cul-more span { transform: translateX(3px); display:inline-block; }
            @media (max-width: 960px) {
              .cul-pillars { grid-template-columns: 1fr !important; }
              .cul-beliefs { grid-template-columns: 1fr 1fr !important; }
              .cul-split { grid-template-columns: 1fr !important; }
              .cul-split--rev > div:first-child { order: 2; }
              .cul-explore { grid-template-columns: 1fr !important; }
            }
          `}</style>

      );

    function App() {
      const [lang, setLang] = useState('en');
      function changeLang(l){ window.__lang = l; setLang(l); }
      function nav(r){ if (r === 'blog') return (window.location.href = 'Blog.html'); return (window.location.href = 'index.html'); }
      return (
        <>
          <SiteHeader overlay={false} megaTheme="cream" lang={lang} onLang={changeLang} onNav={nav} />
          <Culture key={'cul-' + lang} />
          <SiteNewsletter key={'nl-' + lang} />
          <SiteFooter />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
