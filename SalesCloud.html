    /* Six steps: step list on the left, one large screen on the right. Click to switch; cycles every 6s. */
    function HowItWorks() {
      const [active, setActive] = useState(0);
      const [paused, setPaused] = useState(false);
      const s = STEPS[active];
      useEffect(() => { if (paused) return; const t = setInterval(() => setActive(a => (a + 1) % STEPS.length), 6000); return () => clearInterval(t); }, [paused]);

      const List = () => (
        <div className="sc-show-list">
          {STEPS.map((st, i) => (
            <button key={st.num} type="button" className={'sc-show-item' + (i === active ? ' is-on' : '')} onClick={() => setActive(i)} aria-pressed={i === active}>

              <span className="sc-show-arrow" aria-hidden>→</span>
            </button>
          ))}
        </div>
      );

      return (
        <section id="how" className="sc-section sc-section--rule">
          <div className="container-wide">
            <StepsHead />
            <div className="sc-show" onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)}>

            </div>
          </div>
        </section>
      );
    }

    function useAutoIndex(n, ms) {
      const [i, setI] = useState(0);
      const [paused, setPaused] = useState(false);
      useEffect(() => { if (paused) return; const t = setInterval(() => setI(x => (x + 1) % n), ms); return () => clearInterval(t); }, [paused, n, ms]);
      return [i, setI, setPaused];

            .sc-ba-col--after { position: relative; overflow: hidden; color: #fff; background: var(--intigris-coral); border: 1px solid var(--intigris-coral); box-shadow: 0 24px 60px -40px rgba(255,95,54,.55); }
            .sc-ba-col--after > * { position: relative; z-index: 2; }
            .sc-ba-label { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 18px; color: var(--fg-muted); }
            .sc-ba-col--after .sc-ba-label { color: rgba(255,255,255,.85); }
            .sc-ba-col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
            .sc-ba-col li { display: flex; gap: 12px; align-items: flex-start; font-size: 15.5px; line-height: 1.45; }
            .sc-ba-check { width: 22px; height: 22px; border-radius: 999px; background: var(--intigris-coral); color: var(--intigris-dark-brown); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; margin-top: 3px; }
            .sc-ba-col--after li div { display: flex; flex-direction: column; gap: 5px; }
            .sc-ba-col--after li b { font-weight: 500; letter-spacing: -.015em; color: #fff; font-size: 21px; line-height: 1.25; }
            .sc-ba-col--after li span { font-size: 14px; color: var(--intigris-dark-brown); }
            .sc-ba-col--after li .sc-ba-check { background: rgba(255,255,255,.92); color: var(--intigris-coral-700); box-shadow: 0 2px 6px rgba(0,0,0,.12); }

            @media (max-width: 980px) { .sc-what { grid-template-columns: 1fr; } .sc-what-photo { min-height: 280px; } }

            /* ---------- six steps showcase ---------- */
            .sc-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--intigris-coral); flex: none; margin-top: 7px; }
            .sc-show { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.5fr); gap: clamp(24px, 3vw, 48px); align-items: start; }
            .sc-show-list { display: flex; flex-direction: column; gap: 10px; }
            .sc-show-item { appearance: none; font: inherit; text-align: left; cursor: pointer; display: grid; grid-template-columns: 34px 1fr 20px; gap: 12px; align-items: center; padding: 14px 16px; background: var(--intigris-paper); border: 1px solid var(--border); border-radius: 16px; color: var(--intigris-dark-brown); transition: background 200ms var(--ease-out), border-color 200ms var(--ease-out), transform 200ms var(--ease-out); }
            .sc-show-item:hover { border-color: var(--intigris-coral); }
            .sc-show-item.is-on { background: var(--intigris-coral); border-color: var(--intigris-coral); color: var(--intigris-dark-brown); transform: translateX(6px); }
            .sc-show-num { font-size: 12px; font-weight: 600; letter-spacing: .12em; color: var(--intigris-coral-700); }
            .sc-show-item.is-on .sc-show-num { color: var(--intigris-dark-brown); }
            .sc-show-copy { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
            .sc-show-copy b { font-size: 17px; font-weight: 500; letter-spacing: -.014em; }
            .sc-show-copy small { font-size: 12.5px; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .sc-show-item.is-on .sc-show-copy small { color: rgba(64,35,1,.75); }
            .sc-show-arrow { color: var(--intigris-coral); transition: transform 200ms var(--ease-out); }
            .sc-show-item.is-on .sc-show-arrow { color: var(--intigris-dark-brown); transform: translateX(3px); }
            .sc-show-stage { background: var(--intigris-paper); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: clamp(20px, 2.5vw, 36px); }
            /* stage: text row on top, screen below at full width */
            .sc-show-stage--stack { display: flex; flex-direction: column; gap: clamp(20px, 2.5vw, 32px); }
            .sc-show-detail--stack h3 { margin: 0 0 14px; }
            .sc-show-detail--row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, .9fr); gap: clamp(16px, 3vw, 48px); align-items: start; }
            .sc-show-detail--stack .sc-show-detail--row p { margin: 0; max-width: 620px; }
            .sc-show-detail--stack .sc-show-detail--row ul { margin: 0; padding-left: 0; gap: 0; }
            .sc-show-detail--stack .sc-show-detail--row li { font-size: 15.5px; line-height: 1.55; color: var(--fg-muted); }
            .sc-show-detail--stack .sc-show-detail--row li .sc-dot { margin-top: 8.5px; }
            .sc-show-stage--stack .sc-show-screen .sf { max-width: none; width: 100%; }
            .sc-show-stage--stack .sc-show-screen .sf:not(.sf--wide) { max-width: 640px; }
            .sc-show-screen { display: flex; justify-content: center; animation: fadeIn 400ms var(--ease-out) both; }
            .sc-show-detail { animation: fadeIn 400ms var(--ease-out) both; }
            .sc-show-detail h3 { font-size: clamp(24px, 2.4vw, 32px); font-weight: 500; letter-spacing: -.02em; line-height: 1.08; margin: 0; }
            .sc-show-detail p { margin: 14px 0 0; font-size: 15.5px; line-height: 1.55; color: var(--fg-muted); }
            .sc-show-detail ul { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
            .sc-show-detail li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; }

            /* ---------- who · shared ---------- */
            .sc-spot-result { display: flex; flex-direction: column; gap: 4px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
            .sc-spot-result b { font-size: clamp(20px, 1.8vw, 24px); font-weight: 500; letter-spacing: -.018em; line-height: 1.15; }
            .sc-spot-result small { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted); font-weight: 500; }

            /* ---------- who runs on it ---------- */
            .sc-railtabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
            .sc-railtab { appearance: none; font: inherit; text-align: left; cursor: pointer; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 3px; padding: 16px 18px 20px; border-radius: 16px; border: 1px solid rgba(64,35,1,.18); background: rgba(252,247,235,.35); color: var(--intigris-dark-brown); transition: background 200ms var(--ease-out); }
            .sc-railtab-logo { height: 28px; display: flex; align-items: center; margin-bottom: 10px; }
            .sc-railtab-logo img { max-height: 28px; max-width: 140px; width: auto; height: auto; object-fit: contain; display: block; }
            .sc-railtab-mono { width: 28px; height: 28px; border-radius: 8px; border: 1.5px dashed rgba(64,35,1,.35); display: grid; place-items: center; font-size: 13px; font-weight: 600; color: rgba(64,35,1,.6); }
            .sc-railtab.is-on .sc-railtab-mono { border-color: var(--intigris-coral); color: var(--intigris-coral-700); }
            .sc-railstory-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
            .sc-railstory-brand img { max-height: 28px; max-width: 140px; width: auto; height: auto; object-fit: contain; display: block; }
            .sc-railtab b { font-size: 17px; font-weight: 500; letter-spacing: -.014em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .sc-railtab small { font-size: 12.5px; color: rgba(64,35,1,.7); }
            .sc-railtab:hover { background: rgba(252,247,235,.6); }
            .sc-railtab.is-on { background: var(--intigris-off-white); border-color: var(--intigris-off-white); }
            .sc-railtab-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--intigris-dark-brown); }
            .sc-railtab.is-on .sc-railtab-bar { animation: railFill 5s linear both; }
            @keyframes railFill { from { width: 0; } to { width: 100%; } }
            .sc-railstory { position: relative; background: var(--intigris-off-white); border-radius: var(--radius-xl); padding: clamp(28px, 3.5vw, 48px); display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, .8fr); gap: clamp(28px, 4vw, 64px); align-items: start; animation: fadeIn 420ms var(--ease-out) both; min-height: 300px; }
            .sc-railstory blockquote { margin: 0; font-size: clamp(24px, 2.4vw, 34px); font-weight: 700; letter-spacing: -.02em; line-height: 1.2; color: var(--intigris-dark-brown); text-wrap: balance; }
            .sc-railstory-side { display: flex; flex-direction: column; gap: 16px; padding-left: clamp(0px, 3vw, 40px); border-left: 1px solid var(--border); align-self: stretch; }
            .sc-railstory-side p { margin: 0; font-size: 15px; line-height: 1.55; color: var(--fg-muted); flex: 1; }

            @media (max-width: 980px) {
              .sc-railstory { grid-template-columns: 1fr; }
              .sc-railstory-side { padding-left: 0; border-left: 0; padding-top: 18px; border-top: 1px solid var(--border); }
              .sc-railtabs { grid-template-columns: repeat(2, 1fr); }
            }

            /* ---------- offers ---------- */
            .sc-offers { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: stretch; }
            .sc-offer { background: var(--intigris-off-white-200); border: 1px solid var(--intigris-brown-100); border-radius: var(--radius-xl); padding: clamp(24px, 3vw, 36px); display: flex; flex-direction: column; gap: 18px; }
            .sc-offer--hi { position: relative; overflow: hidden; color: #fff; background: var(--intigris-coral); border: 1px solid var(--intigris-coral); box-shadow: 0 24px 60px -40px rgba(255,95,54,.55); }
            .sc-offer--hi > * { position: relative; z-index: 2; }
            .sc-offer--hi .eyebrow { color: rgba(255,255,255,.85); }
            .sc-offer--hi h3 { color: #fff; }
            .sc-offer.sc-offer--hi > p { color: var(--intigris-dark-brown); }
            .sc-offer--hi .sc-offer-badge { background: rgba(255,255,255,.92); color: var(--intigris-coral-700); }
            .sc-offer--hi .sc-weeks li { background: #ff7a55; border-color: rgba(255,255,255,.35); }
            .sc-offer--hi .sc-weeks small { color: rgba(255,255,255,.85); }
            .sc-offer--hi .sc-weeks b { color: #fff; }
            .sc-offer--hi .sc-weeks span { color: var(--intigris-dark-brown); }
            .sc-offer--hi .sc-offer-inc { color: var(--intigris-dark-brown); }
            .sc-offer--hi .sc-offer-inc small { color: rgba(255,255,255,.85); }
            .sc-offer--hi .btn-primary { background: var(--intigris-dark-brown); color: var(--intigris-off-white); }
            .sc-offer--hi .btn-primary:hover { background: var(--intigris-brown-700); color: var(--intigris-off-white); }
            .sc-offer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
            .sc-offer h3 { font-size: clamp(24px, 2.4vw, 32px); font-weight: 500; letter-spacing: -.02em; line-height: 1.1; margin: 10px 0 0; }
            .sc-offer > p { margin: 0; font-size: 15.5px; line-height: 1.6; color: var(--fg-muted); }
            .sc-offer-badge { flex: none; font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; background: var(--intigris-coral); color: var(--intigris-dark-brown); }
            .sc-offer-badge--soft { background: var(--intigris-paper); border: 1px solid var(--intigris-brown-100); color: var(--fg-muted); }
            .sc-weeks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .sc-weeks li { background: var(--intigris-paper); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
            .sc-weeks small { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--intigris-coral-700); font-weight: 600; }
            .sc-weeks b { font-size: 14.5px; font-weight: 500; }
            .sc-weeks span { font-size: 12.5px; color: var(--fg-muted); line-height: 1.4; }
            .sc-process { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .sc-process li { background: var(--intigris-paper); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; font-weight: 500; display: flex; flex-direction: column; gap: 4px; }
            .sc-process small { font-size: 11px; letter-spacing: .08em; color: var(--intigris-coral-700); font-weight: 600; }
            .sc-offer-inc { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; line-height: 1.5; color: var(--intigris-dark-brown); flex: 1; }
            .sc-offer-inc small { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-muted); font-weight: 600; }
            .sc-offer .btn { align-self: flex-start; }

            /* ---------- works with ---------- */

            /* ---------- faq ---------- */
            .sc-faq-grid { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: clamp(28px, 5vw, 72px); align-items: start; }
            .sc-faq { border-top: 1px solid var(--border); }
            .sc-faq-item { border-bottom: 1px solid var(--border); }
            .sc-faq-item button { appearance: none; background: none; border: 0; width: 100%; text-align: left; padding: 20px 0; display: flex; justify-content: space-between; align-items: center; gap: 20px; cursor: pointer; font: inherit; font-size: 18px; font-weight: 500; letter-spacing: -.012em; color: var(--intigris-dark-brown); }
            .sc-faq-item button i { font-style: normal; color: var(--intigris-coral); font-size: 22px; line-height: 1; flex: none; }
            .sc-faq-item p { margin: 0 0 22px; font-size: 15.5px; line-height: 1.6; color: var(--fg-muted); max-width: 640px; }
            .sc-faq-item.is-open button { color: var(--intigris-coral); }

            /* ---------- responsive ---------- */
            @media (max-width: 980px) { .sc-show, .sc-show-detail--row { grid-template-columns: 1fr; } }
            @media (max-width: 980px) {
              .sc-hero-grid, .sc-customers, .sc-offers, .sc-faq-grid { grid-template-columns: 1fr; }
              .sc-hero-grid { align-items: start; } .sc-proof { justify-self: start; }
            }
            @media (max-width: 620px) {
              .sc-logos, .sc-weeks { grid-template-columns: 1fr; }
              .sc-process { grid-template-columns: repeat(2, 1fr); }
              .sc-ui-kanban, .sc-ui-kpis { grid-template-columns: repeat(2, minmax(0,1fr)); }
            }
          `}</style>
        </main>
      );
    }

    function App() {
      const [lang, setLang] = useState('en');
      const [contactOpen, setContactOpen] = useState(false);
      function changeLang(l){ window.__lang = l; document.documentElement.setAttribute('lang', l); setLang(l); }
      function nav(r){
        if (r === 'contact') return setContactOpen(true);
        if (r === 'home') return (window.location.href = 'index.html');
        return (window.location.href = 'index.html');
      }
      return (
        <>
          <SiteHeader overlay={true} megaTheme="cream" lang={lang} onLang={changeLang} onNav={nav} />
          <SalesCloudPage key={'sc-' + lang} onCta={() => setContactOpen(true)} />
          <SiteNewsletter key={'nl-' + lang} />
          <SiteFooter key={'f-' + lang} />
          <SiteCookieConsent />
          <SiteContactSheet open={contactOpen} onClose={() => setContactOpen(false)} source="SalesCloud.html" />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideRight { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</body>
